<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- ATMOSPHERIC GRADIENTS -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080706" />
      <stop offset="45%" stop-color="#11110F" />
      <stop offset="75%" stop-color="#16130F" />
      <stop offset="100%" stop-color="#11110F" />
    </linearGradient>

    <radialGradient id="lampGlowLeft" cx="240" cy="420" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4A359" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#B88A4A" stop-opacity="0.15" />
      <stop offset="75%" stop-color="#8E6837" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#11110F" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="lampGlowRight" cx="1680" cy="420" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4A359" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#B88A4A" stop-opacity="0.15" />
      <stop offset="75%" stop-color="#8E6837" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#11110F" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerAtmosphere" cx="960" cy="540" r="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B88A4A" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#59442B" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#11110F" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ironTruss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16130F" />
      <stop offset="50%" stop-color="#262018" />
      <stop offset="100%" stop-color="#16130F" />
    </linearGradient>

    <!-- Floor Deep Fog Gradient (Smooth, Deep, Zero Vector Clutter) -->
    <linearGradient id="floorFadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16130F" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#11110F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#11110F" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- LAYER 1: DEEP CINEMATIC BACKDROP -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />
  <circle cx="960" cy="540" r="650" fill="url(#centerAtmosphere)" />

  <!-- LAYER 2: DISTANT 1920s STATION ARCH & MISTY VAULT -->
  <g opacity="0.22" stroke="#59442B" stroke-width="1.5" fill="none">
    <path d="M 760 620 A 200 200 0 0 1 1160 620 L 1160 680 L 760 680 Z" fill="#14120E" fill-opacity="0.5" />
    <path d="M 800 620 A 160 160 0 0 1 1120 620" />
    <path d="M 840 620 A 120 120 0 0 1 1080 620" />
    <line x1="960" y1="420" x2="960" y2="680" />
    <line x1="860" y1="480" x2="1060" y2="480" />
    <line x1="810" y1="540" x2="1110" y2="540" />
  </g>

  <!-- LAYER 3: DISTANT LOCOMOTIVE SILHOUETTE & WARM BEAM -->
  <g opacity="0.28" transform="translate(930, 570)">
    <rect x="10" y="24" width="40" height="26" fill="#0B0A08" />
    <path d="M 0 35 L 15 24 L 45 24 L 52 35 L 52 50 L 0 50 Z" fill="#11110F" />
    <rect x="8" y="12" width="7" height="15" fill="#0B0A08" />
    <!-- Golden Headlamp beam -->
    <polygon points="6,34 0,33 -240,0 -240,70" fill="#B88A4A" fill-opacity="0.07" />
    <circle cx="6" cy="34" r="3.5" fill="#D4A359" fill-opacity="0.85" />
    <!-- Billowing Steam Clouds -->
    <path d="M 12 10 Q 5 -10 25 -25 Q 50 -40 20 -60 Q -10 -40 -5 -20 Z" fill="#E8D9BA" fill-opacity="0.06" />
    <path d="M 16 8 Q 30 -15 60 -18 Q 90 -20 70 -45 Q 40 -40 30 -20 Z" fill="#E8D9BA" fill-opacity="0.04" />
  </g>

  <!-- LAYER 4: INDUSTRIAL IRON ROOF ARCHES & STATION CANOPY -->
  <g fill="none" stroke="url(#ironTruss)" opacity="0.55">
    <path d="M -40 360 Q 960 -140 1960 360" stroke-width="10" />
    <path d="M -40 400 Q 960 -100 1960 400" stroke-width="6" stroke="#11110F" />
    <path d="M 100 480 Q 960 120 1820 480" stroke-width="5" stroke="#262018" opacity="0.5" />

    <!-- Vertical truss hangers & cross-braces -->
    <g stroke="#3A332A" stroke-width="2" opacity="0.45">
      <line x1="300" y1="220" x2="300" y2="520" />
      <line x1="450" y1="170" x2="450" y2="540" />
      <line x1="600" y1="130" x2="600" y2="560" />
      <line x1="750" y1="105" x2="750" y2="580" />
      <line x1="960" y1="90" x2="960" y2="590" stroke-width="2.5" stroke="#B88A4A" stroke-opacity="0.35" />
      <line x1="1170" y1="105" x2="1170" y2="580" />
      <line x1="1320" y1="130" x2="1320" y2="560" />
      <line x1="1470" y1="170" x2="1470" y2="540" />
      <line x1="1620" y1="220" x2="1620" y2="520" />

      <!-- Lattice diagonals -->
      <line x1="300" y1="220" x2="450" y2="540" />
      <line x1="450" y1="170" x2="300" y2="520" />
      <line x1="600" y1="130" x2="750" y2="580" />
      <line x1="750" y1="105" x2="600" y2="560" />
      <line x1="1170" y1="105" x2="1320" y2="560" />
      <line x1="1320" y1="130" x2="1170" y2="580" />
      <line x1="1470" y1="170" x2="1620" y2="520" />
      <line x1="1620" y1="220" x2="1470" y2="540" />
    </g>
  </g>

  <!-- LAYER 5: LEFT & RIGHT CAST-IRON COLUMNS -->
  <g fill="#14120E" stroke="#24201A" stroke-width="2">
    <!-- Left Column -->
    <rect x="220" y="280" width="34" height="480" />
    <rect x="212" y="270" width="50" height="16" fill="#1C1813" />
    <rect x="208" y="720" width="58" height="26" fill="#171511" />

    <!-- Right Column -->
    <rect x="1666" y="280" width="34" height="480" />
    <rect x="1658" y="270" width="50" height="16" fill="#1C1813" />
    <rect x="1654" y="720" width="58" height="26" fill="#171511" />
  </g>

  <!-- LAYER 6: VINTAGE ORNATE RAILWAY GASLAMPS -->
  <!-- Left Lamp Glow & Fixture -->
  <circle cx="240" cy="420" r="380" fill="url(#lampGlowLeft)" />
  <g transform="translate(238, 390)">
    <path d="M 0 30 Q -40 20 -40 -10 Q -40 -30 -10 -40 L 0 -40" fill="none" stroke="#B88A4A" stroke-width="3.5" />
    <polygon points="-16,-20 16,-20 11,20 -11,20" fill="#171511" stroke="#B88A4A" stroke-width="1.8" />
    <polygon points="-12,-16 12,-16 8,16 -8,16" fill="#D4A359" fill-opacity="0.8" />
    <ellipse cx="0" cy="2" rx="4" ry="7" fill="#FFF2CE" />
    <polygon points="0,-32 -20,-20 20,-20" fill="#24201A" stroke="#B88A4A" stroke-width="1.5" />
    <circle cx="0" cy="-34" r="3" fill="#D4A359" />
  </g>

  <!-- Right Lamp Glow & Fixture -->
  <circle cx="1680" cy="420" r="380" fill="url(#lampGlowRight)" />
  <g transform="translate(1682, 390)">
    <path d="M 0 30 Q 40 20 40 -10 Q 40 -30 10 -40 L 0 -40" fill="none" stroke="#B88A4A" stroke-width="3.5" />
    <polygon points="-16,-20 16,-20 11,20 -11,20" fill="#171511" stroke="#B88A4A" stroke-width="1.8" />
    <polygon points="-12,-16 12,-16 8,16 -8,16" fill="#D4A359" fill-opacity="0.8" />
    <ellipse cx="0" cy="2" rx="4" ry="7" fill="#FFF2CE" />
    <polygon points="0,-32 -20,-20 20,-20" fill="#24201A" stroke="#B88A4A" stroke-width="1.5" />
    <circle cx="0" cy="-34" r="3" fill="#D4A359" />
  </g>

  <!-- LAYER 7: PURE ATMOSPHERIC STEAM & SEAMLESS CINEMATIC FLOOR (ZERO CLUTTER, SEAMLESS MERGE) -->
  <rect x="0" y="650" width="1920" height="430" fill="url(#floorFadeGrad)" />
  
  <!-- Subtle wide soft cinematic ground fog -->
  <rect x="0" y="720" width="1920" height="360" fill="#11110F" opacity="0.85" />
</svg>
