<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <title>Teammates - Footstep Power Harvesting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="teammates-page">
  <div class="noise"></div>
  <!-- STAR TRAIL CANVAS -->
  <canvas id="star-trail"></canvas>
  
  <div class="space-vector" aria-hidden="true">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <ellipse class="space-orbit orbit-a" cx="800" cy="450" rx="560" ry="260" />
      <ellipse class="space-orbit orbit-b" cx="800" cy="450" rx="380" ry="170" />
      <path class="space-path" d="M-100 650 C250 180 500 850 820 360 S1300 100 1750 520" />
      <path class="space-path path-b" d="M-150 250 C220 620 520 80 860 550 S1320 800 1750 250" />
      <circle class="space-dot" cx="250" cy="180" r="2" />
      <circle class="space-dot" cx="450" cy="700" r="2" />
      <circle class="space-dot" cx="1120" cy="220" r="2" />
      <circle class="space-dot" cx="1370" cy="650" r="2" />
    </svg>
  </div>
  <div class="hero-glow hero-glow-1"></div>
  <div class="hero-glow hero-glow-2"></div>

  <div class="hero teammates-wrapper">
    <div class="teammates-header">
      <div class="section-label reveal"> Meet My Beloved Teammates</div>
      <h2 class="reveal">Footstep Power<br>Harvesting System</h2>
      <a href="index.html#work" class="text-button back-btn reveal delay"><span>←</span> Back to Portfolio</a>
    </div>

    <div class="teammates-list">
      <!-- Shakir Farhan -->
      <div class="teammate-card reveal">
        <div class="teammate-photo-wrap">
          <div class="circular-box">
            <img src="assets/Shakir.jpg" alt="Shakir Farhan" class="teammate-img teammate-img-shakir" />
          </div>
        </div>
        <h3 class="teammate-name">Shakir Farhan</h3>
        <p class="teammate-role">Hardware Setup</p>
      </div>

      <!-- Shafin Bin Mahbub -->
      <div class="teammate-card reveal delay">
        <div class="teammate-photo-wrap">
          <div class="circular-box">
            <img src="assets/Shafin.jpeg" alt="Shafin Bin Mahbub" class="teammate-img teammate-img-shafin" />
          </div>
        </div>
        <h3 class="teammate-name">Shafin Bin Mahbub</h3>
        <p class="teammate-role">Simulation & Modeling</p>
      </div>

      <!-- Rifat Habib -->
      <div class="teammate-card reveal delay-2">
        <div class="teammate-photo-wrap">
          <div class="circular-box">
            <!-- User will add img here -->
            <img src="assets/RIfat%20Habib.jpeg" alt="Rifat Habib" class="teammate-img teammate-img-rifat" />
          </div>
        </div>
        <h3 class="teammate-name">Rifat Habib</h3>
        <p class="teammate-role">Logistics & Demonstration</p>
      </div>

      <!-- Tasmiah Jannat -->
      <div class="teammate-card reveal delay-3">
        <div class="teammate-photo-wrap">
          <div class="circular-box">
            <img src="assets/Tasmiah.jpeg" alt="Tasmiah Jannat" class="teammate-img teammate-img-tasmiah" />
          </div>
        </div>
        <h3 class="teammate-name">Tasmiah Jannat</h3>
        <p class="teammate-role">Presentation & Demonstration</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
